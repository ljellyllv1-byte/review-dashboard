<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问验证 - 要闻复审审核数据看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            border-radius: 4px;
        }

        .info-box p {
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 访问验证</h1>
        <p class="subtitle">要闻复审审核数据看板</p>

        <div class="input-group">
            <label for="password">请输入访问密码</label>
            <input type="password" id="password" placeholder="输入密码..." onkeypress="handleKeyPress(event)">
        </div>

        <button class="login-btn" onclick="verifyPassword()">进入看板</button>

        <div class="error-msg" id="errorMsg">❌ 密码错误,请重试</div>

        <div class="info-box">
            <p><strong>💡 使用说明:</strong></p>
            <p>• 需要访问密码才能查看看板</p>
            <p>• 联系管理员获取密码</p>
            <p>• 密码验证通过后跳转至数据看板</p>
        </div>
    </div>

    <script>
        // 从URL参数获取真实密码,这样密码不会硬编码在前端
        const urlParams = new URLSearchParams(window.location.search);
        const correctPassword = urlParams.get('p') || 'tencent2024'; // 默认密码

        function verifyPassword() {
            const inputPassword = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (inputPassword === correctPassword) {
                // 密码正确,保存到localStorage
                localStorage.setItem('dashboard_access', 'granted');
                // 跳转到主页
                window.location.href = 'review_dashboard_non_task.html';
            } else {
                // 密码错误
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                
                // 3秒后隐藏错误消息
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                verifyPassword();
            }
        }

        // 自动聚焦到密码输入框
        window.onload = function() {
            document.getElementById('password').focus();
        };
    </script>
</body>
</html>
