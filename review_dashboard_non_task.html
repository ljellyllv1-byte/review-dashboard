<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>要闻复审审核数据看板 - 非任务时间版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 2em;
            font-weight: bold;
            color: #764ba2;
        }

        .card .sub-value {
            font-size: 0.8em;
            color: #999;
            margin-top: 5px;
        }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .chart-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .rank-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .rank-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .rank-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }

        .rank-table-container {
            max-height: 400px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: #f0f4ff;
        }

        .rank-1 {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%) !important;
            color: white !important;
        }

        .rank-2 {
            background: linear-gradient(135deg, #C0C0C0 0%, #A0A0A0 100%) !important;
            color: white !important;
        }

        .rank-3 {
            background: linear-gradient(135deg, #CD7F32 0%, #B8860B 100%) !important;
            color: white !important;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .success {
            background: #4CAF50;
        }

        .error {
            background: #f44336;
        }

        .table-container {
            max-height: 500px;
            overflow-y: auto;
        }

        .direction-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            margin: 2px;
            color: white;
        }

        .tag-值班 { background: #FF6B6B; }
        .tag-培训 { background: #4ECDC4; }
        .tag-开会 { background: #45B7D1; }
        .tag-其他 { background: #96CEB4; }
        .tag-审核 { background: #FFEAA7; color: #333; }

        /* 日期选择器样式 */
        .date-filter-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .date-filter-section:hover {
            transform: translateY(-5px);
        }

        .date-filter-title {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-filter-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .date-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-input-group label {
            font-weight: 600;
            color: #555;
            min-width: 80px;
        }

        .date-input-group input {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .date-input-group input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }

        .filter-btn {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .reset-btn {
            padding: 10px 25px;
            background: #f0f0f0;
            color: #666;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #e0e0e0;
        }

        .date-range-info {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }

        .date-range-info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 要闻复审审核数据看板 - 非任务时间版</h1>

        <!-- 日期筛选区域 -->
        <div class="date-filter-section">
            <div class="date-filter-title">
                📅 时间段筛选
            </div>
            <div class="date-filter-controls">
                <div class="date-input-group">
                    <label>开始日期：</label>
                    <input type="date" id="startDate">
                </div>
                <div class="date-input-group">
                    <label>结束日期：</label>
                    <input type="date" id="endDate">
                </div>
                <button class="filter-btn" onclick="applyDateFilter()">🔍 应用筛选</button>
                <button class="reset-btn" onclick="resetDateFilter()">↩️ 重置</button>
            </div>
            <div class="date-range-info" id="dateRangeInfo">
                当前显示：<strong>全部数据</strong>
            </div>
        </div>

        <!-- 整体指标 -->
        <div class="summary-cards">
            <div class="card">
                <h3>👥 总人数</h3>
                <div class="value" id="totalPeople">0</div>
            </div>
            <div class="card">
                <h3>📝 总审核量</h3>
                <div class="value" id="totalReview">0</div>
            </div>
            <div class="card">
                <h3>⏱️ 总非任务时长</h3>
                <div class="value" id="totalNonTask">0</div>
                <div class="sub-value">小时</div>
            </div>
            <div class="card">
                <h3>📊 平均非任务时长</h3>
                <div class="value" id="avgNonTask">0</div>
                <div class="sub-value">小时/人</div>
            </div>
            <div class="card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <h3 style="color: white;">👁️ 页面访问量</h3>
                <div class="value" id="pageViews" style="color: white;">加载中...</div>
                <div class="sub-value" style="color: rgba(255,255,255,0.8);">次访问</div>
            </div>
        </div>

        <!-- 排名区域 -->
        <div class="rank-section">
            <h3>🏆 排名榜单</h3>
            <div class="rank-grid">
                <!-- 审核量排名 -->
                <div class="rank-table-container">
                    <h4 style="color: #667eea; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #f0f0f0;">📝 审核量排名</h4>
                    <table id="reviewRankTable">
                        <thead>
                        <tr>
                            <th>排名</th>
                            <th>姓名</th>
                            <th>中文姓名</th>
                            <th>审核量</th>
                            <th>平均耗时</th>
                        </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>

                <!-- 非任务时间排名 -->
                <div class="rank-table-container">
                    <h4 style="color: #764ba2; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #f0f0f0;">⏱️ 非任务时间排名</h4>
                    <table id="nonTaskRankTable">
                        <thead>
                        <tr>
                            <th>排名</th>
                            <th>姓名</th>
                            <th>中文姓名</th>
                            <th>非任务时长(h)</th>
                            <th>记录数</th>
                            <th>平均时长(h)</th>
                        </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-section">
            <div class="chart-card">
                <h3>🎯 非任务时间去向分布（总体）</h3>
                <div class="chart-container">
                    <canvas id="directionChart"></canvas>
                </div>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-card">
                <h3>🎯 非任务时间占比分析</h3>
                <div class="chart-container">
                    <canvas id="proportionChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 表格区域 -->
        <div class="rank-section">
            <h3>📋 个人非任务时间明细</h3>
            <div class="table-container">
                <table id="detailTable">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>中文姓名</th>
                            <th>非任务总时长（小时）</th>
                            <th>记录数</th>
                            <th>平均时长（小时）</th>
                            <th>审核量</th>
                            <th>去向明细</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 通知提示 -->
    <div class="notification" id="notification"></div>

    <script>
        // 全局变量
        let reviewData = [];
        let originalData = []; // 保存原始数据
        let directionChart, proportionChart;

        // 加载初始数据
        function loadData() {
            // 自动检测路径（本地或GitHub Pages）
            const basePath = window.location.pathname.includes('/review-dashboard/') ? '/review-dashboard/' : '/';
            // 添加时间戳参数强制刷新缓存
            const timestamp = new Date().getTime();

            console.log('当前路径:', window.location.pathname);
            console.log('检测到的基础路径:', basePath);
            console.log('数据文件URL:', basePath + 'review_dashboard_with_quality_new.json');

            // 加载看板数据文件
            fetch(basePath + 'review_dashboard_with_quality_new.json?v=' + timestamp)
                .then(response => {
                    console.log('HTTP状态码:', response.status);
                    if (!response.ok) {
                        // 如果新文件不存在，尝试加载原文件
                        return fetch(basePath + 'review_dashboard_with_non_task.json?v=' + timestamp);
                    }
                    return response;
                })
                .then(response => response.json())
                .then(data => {
                    reviewData = data.review_data;
                    originalData = data; // 保存原始完整数据

                    // 更新汇总数据
                    updateSummary(data.summary);

                    updateCharts(data);
                    updateReviewRank(data.review_data);
                    updateNonTaskRank(data.review_data);
                    updateTable(data.review_data);
                    showNotification('数据加载成功！', 'success');

                    // 设置日期选择器的默认值
                    if (data.非任务时间 && data.非任务时间.日期趋势) {
                        setDateRange(data.非任务时间.日期趋势);
                    }
                })
                .catch(error => {
                    console.error('数据加载失败:', error);
                    console.error('错误详情:', error.message);
                    showNotification('数据加载失败，请刷新页面重试', 'error');
                });
        }

        // 设置日期范围
        function setDateRange(dateTrend) {
            // 根据数据动态设置日期范围
            if (!dateTrend || !dateTrend.length) return;
            const dates = dateTrend.map(d => d.date || d.日期).filter(Boolean).sort();
            const cycleStart = dates[0];
            const cycleEnd = dates[dates.length - 1];
            
            document.getElementById('startDate').value = cycleStart;
            document.getElementById('endDate').value = cycleEnd;
            document.getElementById('startDate').min = cycleStart;
            document.getElementById('startDate').max = cycleEnd;
            document.getElementById('endDate').min = cycleStart;
            document.getElementById('endDate').max = cycleEnd;
        }

        // 应用日期筛选
        function applyDateFilter() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                showNotification('请选择开始和结束日期！', 'error');
                return;
            }

            if (startDate > endDate) {
                showNotification('开始日期不能晚于结束日期！', 'error');
                return;
            }

            // 筛选数据
            const filteredData = filterByDateRange(originalData, startDate, endDate);

            // 更新界面
            updateSummary(filteredData.summary);
            updateCharts(filteredData);
            updateReviewRank(filteredData.review_data);
            updateNonTaskRank(filteredData.review_data);
            updateTable(filteredData.review_data);

            // 更新日期范围信息
            const dateInfo = document.getElementById('dateRangeInfo');
            dateInfo.innerHTML = `当前显示：<strong>${startDate}</strong> 至 <strong>${endDate}</strong>（共筛选出 ${(filteredData.summary['总审核量'] || 0).toLocaleString()} 条审核数据）`;

            showNotification('日期筛选已应用！', 'success');
        }

        // 根据日期范围筛选数据
        function filterByDateRange(data, startDate, endDate) {
            // 筛选审核数据
            const filteredReviewData = data.review_data.filter(item => {
                // 这里假设有日期字段，如果没有则保留所有数据
                // 实际需要根据数据结构调整
                return true;
            });

            // 筛选日期趋势数据
            const dateTrendArr = data.非任务时间.日期趋势 || data.非任务时间.dateTrend || [];
            const filteredDateTrend = dateTrendArr.filter(item => {
                const d = item.date || item.日期;
                return d >= startDate && d <= endDate;
            });

            // 重新计算汇总数据
            const totalNonTaskTime = filteredDateTrend.reduce((sum, item) => sum + (item.non_task_hours || item.时长 || 0), 0);
            const avgNonTaskTime = filteredDateTrend.length > 0 ? totalNonTaskTime / filteredDateTrend.length : 0;

            // 筛选去向分布（需要重新计算）
            const directionCounts = {};
            filteredDateTrend.forEach(item => {
                // 这里简化处理，实际需要根据完整数据重新统计
            });

            // 返回筛选后的数据结构
            return {
                review_data: filteredReviewData,
                summary: {
                    '总人数': filteredReviewData.length,
                    '总审核量': filteredReviewData.reduce((sum, item) => sum + (item['人工审核量'] || 0), 0),
                    '总非任务时长': totalNonTaskTime,
                    '平均非任务时长': avgNonTaskTime
                },
                非任务时间: {
                    去向分布: data.非任务时间.去向分布, // 保持不变或重新计算
                    日期趋势: filteredDateTrend
                }
            };
        }

        // 重置日期筛选
        function resetDateFilter() {
            // 重置日期选择器
            setDateRange(originalData.非任务时间.日期趋势);

            // 恢复原始数据
            updateSummary(originalData.summary);
            updateCharts(originalData);
            updateReviewRank(originalData.review_data);
            updateNonTaskRank(originalData.review_data);
            updateTable(originalData.review_data);


            // 重置日期范围信息
            document.getElementById('dateRangeInfo').innerHTML = '当前显示：<strong>全部数据</strong>';

            showNotification('已重置为全部数据！', 'success');
        }

        // 更新整体指标
        function updateSummary(summary) {
            document.getElementById('totalPeople').textContent = summary['总人数'];
            document.getElementById('totalReview').textContent = summary['总审核量'].toLocaleString();
            document.getElementById('totalNonTask').textContent = summary['总非任务时长'].toFixed(2);
            document.getElementById('avgNonTask').textContent = summary['平均非任务时长'].toFixed(2);

        // 更新图表
        function updateCharts(data) {
            // 去向分布
            updateDirectionChart(data.非任务时间.去向分布);
            // 占比分析
            updateProportionChart(data.review_data);
        }

        // 去向分布图
        function updateDirectionChart(directionData) {
            const labels = Object.keys(directionData);
            const hours = Object.values(directionData); // 直接取值（总时长）
            const totalHours = hours.reduce((sum, h) => sum + h, 0);

            const ctx = document.getElementById('directionChart').getContext('2d');

            if (directionChart) {
                directionChart.destroy();
            }

            directionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '时长（小时）',
                        data: hours,
                        backgroundColor: [
                            'rgba(255, 107, 107, 0.8)',
                            'rgba(78, 205, 196, 0.8)',
                            'rgba(69, 183, 209, 0.8)',
                            'rgba(150, 206, 180, 0.8)',
                            'rgba(255, 234, 167, 0.8)',
                            'rgba(255, 159, 64, 0.8)',
                            'rgba(153, 102, 255, 0.8)',
                            'rgba(255, 99, 132, 0.8)',
                            'rgba(54, 162, 235, 0.8)',
                            'rgba(255, 206, 86, 0.8)'
                        ],
                        borderColor: [
                            'rgba(255, 107, 107, 1)',
                            'rgba(78, 205, 196, 1)',
                            'rgba(69, 183, 209, 1)',
                            'rgba(150, 206, 180, 1)',
                            'rgba(255, 234, 167, 1)',
                            'rgba(255, 159, 64, 1)',
                            'rgba(153, 102, 255, 1)',
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                afterLabel: function(context) {
                                    const index = context.dataIndex;
                                    return `记录数: ${counts[index]}条`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '时长（小时）'
                            }
                        },
                        x: {
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        }

        // 日期趋势图
        function updateTrendChart(trendData) {
            const labels = trendData.map(item => item.日期);
            const hours = trendData.map(item => item.总时长);

            const ctx = document.getElementById('trendChart').getContext('2d');

            if (trendChart) {
                trendChart.destroy();
            }

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '非任务时长（小时）',
                        data: hours,
                        borderColor: 'rgba(102, 126, 234, 1)',
                        backgroundColor: 'rgba(102, 126, 234, 0.2)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '时长（小时）'
                            }
                        },
                        x: {
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        }

        // 非任务时间与审核量关系图
        function updateCorrelationChart(reviewData) {
            const dataWithNonTask = reviewData.filter(item => item.非任务总时长 > 0);

            const ctx = document.getElementById('correlationChart').getContext('2d');

            if (correlationChart) {
                correlationChart.destroy();
            }

            correlationChart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: '人员数据',
                        data: dataWithNonTask.map(item => ({
                            x: item.人工审核量,
                            y: item.非任务总时长,
                            name: item.审核人
                        })),
                        backgroundColor: 'rgba(255, 159, 64, 0.8)',
                        borderColor: 'rgba(255, 159, 64, 1)',
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const point = context.raw;
                                    return `${point.name}: 审核量=${point.x}, 非任务时长=${point.y.toFixed(2)}小时`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            title: {
                                display: true,
                                text: '审核量（条）'
                            },
                            min: 0
                        },
                        y: {
                            title: {
                                display: true,
                                text: '非任务时长（小时）'
                            },
                            min: 0
                        }
                    }
                }
            });
        }

        // 非任务时间占比分析
        function updateProportionChart(reviewData) {
            const dataWithNonTask = reviewData.filter(item => item.非任务总时长 > 0);

            // 计算非任务时间占比（非任务时长 / 审核量）
            const proportions = dataWithNonTask.map(item => ({
                name: item.审核人,
                chinese: item.中文姓名,
                proportion: (item.非任务总时长 / item.人工审核量 * 100).toFixed(4)
            }));

            // 排序
            proportions.sort((a, b) => b.proportion - a.proportion);

            const labels = proportions.map(p => p.name);
            const values = proportions.map(p => p.proportion);

            const ctx = document.getElementById('proportionChart').getContext('2d');

            if (proportionChart) {
                proportionChart.destroy();
            }

            proportionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '非任务时间占比（小时/100条）',
                        data: values,
                        backgroundColor: 'rgba(118, 75, 162, 0.8)',
                        borderColor: 'rgba(118, 75, 162, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const index = context.dataIndex;
                                    return `非任务时间占比: ${values[index]}小时/100条`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '非任务时间占比（小时/100条）'
                            }
                        }
                    }
                }
            });
        }

        // 更新审核量排名
        function updateReviewRank(data) {
            const tbody = document.querySelector('#reviewRankTable tbody');
            const sortedData = [...data].sort((a, b) => b.人工审核量 - a.人工审核量);

            const rows = sortedData.map((item, index) => {
                const rankClass = index < 3 ? `rank-${index + 1}` : '';
                return `
                    <tr class="${rankClass}">
                        <td><strong>${index + 1}</strong></td>
                        <td>${item.审核人}</td>
                        <td>${item.中文姓名 || 'N/A'}</td>
                        <td><strong>${item.人工审核量.toLocaleString()}</strong></td>
                        <td>${item.平均耗时.toFixed(2)}s</td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = rows;
        }

        // 更新质检数据排名
        // 更新非任务时间排名
        function updateNonTaskRank(data) {
            const tbody = document.querySelector('#nonTaskRankTable tbody');
            const sortedData = [...data]
                .filter(item => item.非任务总时长 > 0)
                .sort((a, b) => b.非任务总时长 - a.非任务总时长);

            const rows = sortedData.map((item, index) => {
                const rankClass = index < 3 ? `rank-${index + 1}` : '';
                return `
                    <tr class="${rankClass}">
                        <td><strong>${index + 1}</strong></td>
                        <td>${item.审核人}</td>
                        <td>${item.中文姓名 || 'N/A'}</td>
                        <td><strong>${item.非任务总时长.toFixed(2)}</strong></td>
                        <td>${item.非任务记录数}</td>
                        <td>${item.非任务平均时长.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = rows;
        }

        // 更新表格
        function updateTable(data) {
            const tbody = document.querySelector('#detailTable tbody');

            // 按非任务总时长排序
            const sortedData = [...data].sort((a, b) => b.非任务总时长 - a.非任务总时长);

            const rows = sortedData.map((item, index) => {
                // 处理去向标签
                const directionTags = Object.entries(item.非任务去向 || {}).map(([direction, hours]) => {
                    const tagClass = getDirectionTagClass(direction);
                    return `<span class="direction-tag ${tagClass}">${direction}: ${hours}h</span>`;
                }).join('');

                return `
                    <tr>
                        <td>${item.审核人}</td>
                        <td>${item.中文姓名 || 'N/A'}</td>
                        <td><strong>${item.非任务总时长.toFixed(2)}</strong></td>
                        <td>${item.非任务记录数}</td>
                        <td>${item.非任务平均时长.toFixed(2)}</td>
                        <td>${item.人工审核量.toLocaleString()}</td>
                        <td>${directionTags}</td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = rows;
        }

        // 计算非任务时间统计
        function calculateNonTaskStats() {
            const directions = {};
            const dates = {};

            reviewData.forEach(item => {
                if (item.非任务去向) {
                    Object.entries(item.非任务去向).forEach(([direction, hours]) => {
                        if (!directions[direction]) {
                            directions[direction] = { 总时长: 0, 记录数: 0 };
                        }
                        directions[direction].总时长 += hours;
                        directions[direction].记录数 += 1;
                    });
                }
            });

            return {
                去向分布: directions,
                日期趋势: []
            };
        }

        // 获取去向标签的样式类
        function getDirectionTagClass(direction) {
            if (direction.includes('值班')) return 'tag-值班';
            if (direction.includes('培训')) return 'tag-培训';
            if (direction.includes('开会')) return 'tag-开会';
            if (direction.includes('审核')) return 'tag-审核';
            return 'tag-其他';
        }

        // 显示通知
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type;
            notification.style.display = 'block';

            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // 访问量统计（统计总访问人次）
        function updatePageViews() {
            const pageId = 'review-dashboard-claw-total-visits';
            const url = `https://api.countapi.xyz/hit/${pageId}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const count = data.value || 0;
                    document.getElementById('pageViews').textContent = count.toLocaleString();
                })
                .catch(error => {
                    console.log('访问统计加载失败，使用本地存储');
                    // 备用方案：使用本地存储统计总访问人次
                    let views = parseInt(localStorage.getItem('totalPageViews') || 0) + 1;
                    localStorage.setItem('totalPageViews', views);
                    document.getElementById('pageViews').textContent = views.toLocaleString();
                });
        }

        // 页面加载完成后加载数据
        window.onload = function() {
            loadData();
            updatePageViews();
        };
    </script>
</body>
</html>
